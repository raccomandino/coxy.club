<style>
/* Layout: one still night sky of silk under the quilted dome lattice; emblem, wordmark and a whisper of copy, centred; two quiet corner captions. */
:root{
  --night:#12082E;
  --violet:#6B2BD9;
  --magenta:#E0559B;
  --gold:#F7C46C;
  --mist:#E9E1FF;
  --dim:#A99BD9;
  --f-display:'Syncopate','Arial Black',system-ui,sans-serif;
  --f-serif:'Instrument Serif','Times New Roman',Georgia,serif;
  --f-label:'Jost','Futura','Century Gothic',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--mist);overflow:hidden;font-family:var(--f-label)}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.09;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' fill='white'/></svg>")}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(10,4,26,.75) 100%)}

.stage{position:relative;height:100%;box-sizing:border-box;display:grid;grid-template-rows:auto 1fr auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:clamp(18px,3.5vh,36px)}
.bar{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;
  font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--dim);font-variant-numeric:tabular-nums}
.bar b{font-weight:500;color:var(--mist)}

.centre{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,2.6vh,28px);text-align:center;min-width:0}

@keyframes sheen{to{background-position:-300% 0}}
@keyframes rise{from{opacity:.0;transform:translateY(18px) scale(.96)}to{opacity:1}}

.word{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(30px,8.4vw,120px);line-height:.95;
  letter-spacing:.14em;text-indent:.14em;white-space:nowrap;display:flex;flex-wrap:wrap;justify-content:center;column-gap:.5em;row-gap:.1em}
.word .w{display:inline-flex}
.word span.l{display:inline-block;color:var(--mist);animation:letter 1.1s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.25s + var(--i) * 70ms);
  transition:color .4s, text-shadow .4s}
.word span.l:hover{color:var(--gold);text-shadow:0 0 28px rgba(247,196,108,.6)}
@keyframes letter{from{opacity:.15;transform:translateY(.35em);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

.soon{font-family:var(--f-serif);font-style:italic;font-size:clamp(26px,3.6vw,46px);line-height:1;color:var(--gold);
  display:flex;align-items:center;gap:18px;animation:rise 1.4s 1s cubic-bezier(.2,.7,.2,1) both}
.soon::before,.soon::after{content:"";width:clamp(28px,6vw,72px);height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.soon::after{transform:scaleX(-1)}
.kind{margin:0;font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:var(--dim);text-wrap:balance;
  animation:rise 1.4s 1.2s cubic-bezier(.2,.7,.2,1) both}
.kind i{font-style:normal;color:var(--magenta);padding-inline:.5em}

.hint{transition:opacity .8s}
body.touched .hint{opacity:0}

@media (max-width:520px){
  .word{letter-spacing:.1em;text-indent:.1em}
  .bar{font-size:10px;letter-spacing:.24em}
  .kind{letter-spacing:.3em;font-size:11px}
}
@media (prefers-reduced-motion:reduce){
  .emblem,.word span.l,.soon,.kind{animation:none}
}

<canvas id="sky" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<main class="stage">
  <div class="bar">
    <span>Nightclub <b>&amp;</b> Business Events Club</span>
    <span>London <b id="clock">--:--</b></span>
  </div>

  <div class="centre">
    <div class="emblem" id="emblem" role="img" aria-label="Coxy House Capricorn emblem"></div>
    <h1 class="word" aria-label="Coxy House">
      <span class="w" aria-hidden="true"><span class="l" style="--i:0">C</span><span class="l" style="--i:1">O</span><span class="l" style="--i:2">X</span><span class="l" style="--i:3">Y</span></span>
      <span class="w" aria-hidden="true"><span class="l" style="--i:4">H</span><span class="l" style="--i:5">O</span><span class="l" style="--i:6">U</span><span class="l" style="--i:7">S</span><span class="l" style="--i:8">E</span></span>
    </h1>
    <div class="soon">Coming soon</div>
    <p class="kind">Nights<i>/</i>Business<i>/</i>UK</p>
  </div>

  <div class="bar">
    <span>Venues across the United Kingdom</span>
    <span class="hint">Move &middot; tap the silk</span>
  </div>
</main>

<script>
(() => {
  const cv = document.getElementById('sky');
  const ctx = cv.getContext('2d');
  const lat = document.createElement('canvas'), lctx = lat.getContext('2d');
  const glow = document.createElement('canvas'), gctx = glow.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, dpr = 1;
  const m = { x: .5, y: .5, tx: .5, ty: .5 };
  const ripples = [];

  const ribbons = [
    { c: [107, 43, 217], y: .30, a: .16, f: 1.6, s: .22, ph: 0.0, w: .20 },
    { c: [224, 85, 155], y: .55, a: .18, f: 1.2, s: .17, ph: 2.1, w: .18 },
    { c: [247, 196, 108], y: .72, a: .12, f: 1.9, s: .26, ph: 4.0, w: .12 },
    { c: [150, 70, 235], y: .48, a: .22, f: .9, s: .12, ph: 5.3, w: .24 }
  ];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    W = innerWidth; H = innerHeight;
    for (const c of [cv, lat, glow]) { c.width = W * dpr; c.height = H * dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // quilted diamond lattice, like the dome's cushions
    lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    lctx.clearRect(0, 0, W, H);
    const s = Math.max(34, Math.min(W, H) / 16);
    lctx.strokeStyle = 'rgba(233,225,255,1)';
    lctx.lineWidth = 1;
    lctx.beginPath();
    for (let k = -H; k < W + H; k += s) {
      lctx.moveTo(k, 0); lctx.lineTo(k + H, H);
      lctx.moveTo(k, H); lctx.lineTo(k + H, 0);
    }
    lctx.stroke();
    if (reduce) draw(8);
  }

  function ribbon(r, t) {
    const mx = (m.x - .5), my = (m.y - .5);
    const strands = 26;
    for (let i = 0; i < strands; i++) {
      const k = i / (strands - 1);
      const off = (k - .5) * r.w * H;
      ctx.beginPath();
      for (let x = -40; x <= W + 40; x += 18) {
        const u = x / W;
        const y = r.y * H + off * (1 + .35 * Math.sin(u * 3 + t * .4 + r.ph))
          + Math.sin(u * Math.PI * r.f + t * r.s + r.ph + k * .6) * r.a * H
          + Math.sin(u * 7.0 - t * r.s * 1.7 + r.ph) * .025 * H
          + my * 120 * Math.cos(u * 3 + r.ph) + mx * 60 * Math.sin(u * 5 + k);
        x === -40 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      const edge = 1 - Math.abs(k - .5) * 2;
      ctx.strokeStyle = `rgba(${r.c[0]},${r.c[1]},${r.c[2]},${(.025 + .11 * edge * edge).toFixed(3)})`;
      ctx.lineWidth = 1 + edge * 2.2;
      ctx.stroke();
    }
  }

  function draw(t) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#12082E';
    ctx.fillRect(0, 0, W, H);
    // deep bloom behind the centre
    const bg = ctx.createRadialGradient(W * (.5 + (m.x - .5) * .15), H * .5, 0, W * .5, H * .5, Math.max(W, H) * .7);
    bg.addColorStop(0, 'rgba(84,33,170,.55)');
    bg.addColorStop(.5, 'rgba(40,14,92,.35)');
    bg.addColorStop(1, 'rgba(18,8,46,0)');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    for (const r of ribbons) ribbon(r, t);

    // lattice: faint everywhere, lit near the pointer and ripples
    ctx.globalAlpha = .035;
    ctx.drawImage(lat, 0, 0, W, H);
    ctx.globalAlpha = 1;
    gctx.globalCompositeOperation = 'source-over';
    gctx.clearRect(0, 0, W, H);
    gctx.drawImage(lat, 0, 0, W, H);
    gctx.globalCompositeOperation = 'destination-in';
    const R = Math.max(W, H) * .22;
    const g = gctx.createRadialGradient(m.x * W, m.y * H, 0, m.x * W, m.y * H, R);
    g.addColorStop(0, 'rgba(0,0,0,.55)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    gctx.fillStyle = g; gctx.fillRect(0, 0, W, H);
    ctx.drawImage(glow, 0, 0, W, H);

    // ripple rings in gold
    for (let i = ripples.length - 1; i >= 0; i--) {
      const p = ripples[i], age = t - p.t0;
      if (age > 2.2) { ripples.splice(i, 1); continue; }
      const rad = age * Math.max(W, H) * .5, a = 1 - age / 2.2;
      const s = Math.max(34, Math.min(W, H) / 16);
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(Math.PI / 4);
      ctx.strokeStyle = `rgba(247,196,108,${(.5 * a * a).toFixed(3)})`;
      ctx.lineWidth = 1.5;
      const side = rad * Math.SQRT2;
      ctx.strokeRect(-side / 2, -side / 2, side, side);
      ctx.strokeStyle = `rgba(224,85,155,${(.35 * a * a).toFixed(3)})`;
      const side2 = Math.max(0, side - s * 1.4);
      ctx.strokeRect(-side2 / 2, -side2 / 2, side2, side2);
      ctx.restore();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  const emblem = document.getElementById('emblem');
  let last = performance.now(), T = 0;
  function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;
    m.x += (m.tx - m.x) * .05; m.y += (m.ty - m.y) * .05;
    draw(T);
    emblem.style.transform = `translate(${((m.x - .5) * -14).toFixed(2)}px, ${((m.y - .5) * -10).toFixed(2)}px)`;
    requestAnimationFrame(loop);
  }

  function point(e) {
    const p = e.touches ? e.touches[0] : e;
    m.tx = p.clientX / W; m.ty = p.clientY / H;
    document.body.classList.add('touched');
  }
  addEventListener('pointermove', point, { passive: true });
  addEventListener('touchmove', point, { passive: true });
  addEventListener('pointerdown', e => {
    point(e);
    if (!reduce) ripples.push({ x: e.clientX, y: e.clientY, t0: T });
  });
  addEventListener('resize', resize);

  function tick() {
    try {
      document.getElementById('clock').textContent = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', hour: '2-digit', minute: '2-digit' }).format(new Date());
    } catch (e) {}
  }
  tick(); setInterval(tick, 15000);

  resize();
  if (!reduce) requestAnimationFrame(loop); else draw(8);
})();
</script>

</body></html>
